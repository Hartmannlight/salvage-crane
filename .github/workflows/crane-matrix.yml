name: Build modified cranes
on:
  push:
    branches:
      - "master"
    tags:
      - "v*"
  pull_request:
    branches:
      - "master"

env:
  CRANE_DIR: "cranes"

# https://github.com/dorny/paths-filter#examples
jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      cranes: ${{ steps.changes.outputs.changes }}
    steps:
      - name: Checkout
        id: checkout
        uses: "actions/checkout@v3"

      - id: changes
        uses: dorny/paths-filter@v2
        with:
          filters: |
            dummy: "${{ env.CRANE_DIR }}/dummy/**"
            borgbackup: "${{ env.CRANE_DIR }}/borgbackup/**"
            restic: "${{ env.CRANE_DIR }}/restic/**"

  restic-quality:
    name: Restic quality checks
    needs: changes
    if: ${{ contains(needs.changes.outputs.cranes, 'restic') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: "actions/checkout@v3"

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run restic script tests
        run: bash cranes/restic/test.sh

      - name: Validate shell syntax
        run: |
          bash -n cranes/restic/binary.sh
          bash -n cranes/restic/test.sh
          bash -n cranes/restic/tools/preflight.sh
          bash -n cranes/restic/tools/install.sh
          bash -n cranes/restic/tools/run-crane-smoke.sh

      - name: Run shellcheck
        run: |
          shellcheck cranes/restic/binary.sh
          shellcheck cranes/restic/test.sh
          shellcheck cranes/restic/tools/preflight.sh
          shellcheck cranes/restic/tools/install.sh
          shellcheck cranes/restic/tools/run-crane-smoke.sh

  build-docker:
    name: Build crane images
    needs: changes
    strategy:
      matrix:
        crane: ${{ fromJSON(needs.changes.outputs.cranes) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: "Login to registry"
        id: registry-login
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: "docker/login-action@v2"
        with:
          registry: ghcr.io
          username: "${{ github.repository_owner }}"
          password: "${{ secrets.GITHUB_TOKEN }}"

      - name: Checkout
        id: checkout
        uses: "actions/checkout@v3"

      - name: Docker meta
        id: meta
        uses: "docker/metadata-action@v4"
        with:
          images: "ghcr.io/${{ github.repository }}-${{ matrix.crane }}"
          flavor: |
            latest=auto
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=edge,branch=master
            type=sha
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v3
        with:
          context: "${{ env.CRANE_DIR }}/${{ matrix.crane }}"
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
