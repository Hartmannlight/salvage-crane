name: Build modified cranes
env:
  CRANE_DIR: cranes
jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      cranes: ${{ steps.select.outputs.cranes }}
    steps:
    - name: Checkout
      id: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - id: changes
      uses: dorny/paths-filter@15192bc058cc28a13dbf6cde61f19e18988b7af6
      with:
        filters: |
          dummy: "${{ env.CRANE_DIR }}/dummy/**"
          borgbackup:
            - "${{ env.CRANE_DIR }}/borgbackup/**"
            - ".github/**"
          restic:
            - "${{ env.CRANE_DIR }}/restic/**"
            - ".github/**"
            - "renovate.json"
    - name: Select maintenance images
      id: select
      env:
        CHANGED: ${{ steps.changes.outputs.changes }}
        EVENT: ${{ github.event_name }}
      run: |
        if [[ "$EVENT" == workflow_dispatch ]]; then
          echo 'cranes=["restic","borgbackup"]' >> "$GITHUB_OUTPUT"
        else
          echo "cranes=$CHANGED" >> "$GITHUB_OUTPUT"
        fi
  restic-quality:
    name: Restic quality checks
    needs: changes
    if: ${{ contains(needs.changes.outputs.cranes, 'restic') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Install test dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y shellcheck jq bubblewrap
    - name: Run restic script tests
      run: bash cranes/restic/test.sh
    - name: Validate shell syntax
      run: |
        bash -n cranes/restic/binary.sh
        bash -n cranes/restic/test.sh
        bash -n cranes/restic/tools/preflight.sh
        bash -n cranes/restic/tools/install.sh
        bash -n cranes/restic/tools/run-crane-smoke.sh
        bash -n cranes/restic/tools/repository.sh
        bash -n cranes/restic/tools/setup-hetzner.sh
    - name: Run shellcheck
      run: |
        shellcheck cranes/restic/binary.sh
        shellcheck cranes/restic/test.sh
        shellcheck cranes/restic/tools/preflight.sh
        shellcheck cranes/restic/tools/install.sh
        shellcheck cranes/restic/tools/run-crane-smoke.sh
        shellcheck cranes/restic/tools/repository.sh
        shellcheck -x cranes/restic/tools/setup-hetzner.sh
        shellcheck -x cranes/restic/tests/driver.sh cranes/restic/tests/mock-restic.sh
        shellcheck cranes/restic/tests/image-smoke.sh
    - name: Test backup, retention and restore with the image's restic version
      run: |
        docker build -t salvage-crane-restic:audit cranes/restic
        container=$(docker create --entrypoint /bin/true salvage-crane-restic:audit)
        docker cp "$container:/usr/local/bin/restic" /tmp/restic-test
        docker rm "$container"
        chmod +x /tmp/restic-test
        sudo python3 cranes/restic/tests/integration.py --restic /tmp/restic-test
    - name: Test the Alpine crane image
      run: |
        bash cranes/restic/tests/image-smoke.sh salvage-crane-restic:audit
  build-docker:
    name: Native ${{ matrix.crane }} / ${{ matrix.target.arch }}
    needs: [changes, restic-quality]
    if: >-
      !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.cranes != '[]' &&
      (needs.restic-quality.result == 'success' || needs.restic-quality.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        crane: ${{ fromJSON(needs.changes.outputs.cranes) }}
        target:
          - {arch: amd64, platform: linux/amd64, runner: ubuntu-24.04}
          - {arch: arm64, platform: linux/arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.target.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: Hartmannlight/pipeline-toolkit/actions/build@abb469f033ee28e00ba1061a47dddfc7d961129a
      with:
        context: cranes/${{ matrix.crane }}
        file: cranes/${{ matrix.crane }}/Dockerfile
        platform: ${{ matrix.target.platform }}
    - name: Test the exact native candidate
      env:
        CRANE: ${{ matrix.crane }}
      run: |
        case "$CRANE" in
          restic) bash cranes/restic/tests/image-smoke.sh candidate:gate ;;
          borgbackup) python3 cranes/borgbackup/tests/integration.py candidate:gate ;;
          dummy) docker run --rm candidate:gate ;;
        esac
    - uses: Hartmannlight/pipeline-toolkit/actions/scan@abb469f033ee28e00ba1061a47dddfc7d961129a
    - id: image
      run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/salvage-crane-${{ matrix.crane }}" >> "$GITHUB_OUTPUT"
    - if: github.event_name != 'pull_request'
      uses: Hartmannlight/pipeline-toolkit/actions/publish@abb469f033ee28e00ba1061a47dddfc7d961129a
      with:
        image: ${{ steps.image.outputs.name }}-${{ matrix.target.arch }}
        token: ${{ secrets.GITHUB_TOKEN }}
  publish-manifests:
    name: Publish tested multi-platform images
    needs: [changes, build-docker]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        crane: ${{ fromJSON(needs.changes.outputs.cranes) }}
    steps:
    - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Assemble only the exact images that passed both native gates
      env:
        CRANE: ${{ matrix.crane }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/salvage-crane-$CRANE"
        version="sha-$GITHUB_SHA-r$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
        refs=()
        for arch in amd64 arm64; do
          digest=$(docker buildx imagetools inspect "$image-$arch:$version" --format '{{json .Manifest.Digest}}' | tr -d '"')
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          refs+=("$image-$arch@$digest")
        done
        tags=(-t "$image:$version")
        if [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]]; then
          tags+=(-t "$image:latest" -t "$image:master" -t "$image:edge")
        elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          tags+=(-t "$image:$GITHUB_REF_NAME")
        fi
        docker buildx imagetools create "${tags[@]}" "${refs[@]}"
        docker buildx imagetools inspect "$image:$version"
  maintenance-gate:
    name: ci-gate
    if: always()
    needs:
    - changes
    - restic-quality
    - build-docker
    - publish-manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - name: Require every check
      env:
        RESULTS: ${{ toJSON(needs) }}
      run: |
        python3 - <<'PY'
        import json, os
        results = json.loads(os.environ['RESULTS'])
        failed = {name: value['result'] for name, value in results.items() if value['result'] not in ('success', 'skipped')}
        if failed:
            raise SystemExit(str(failed))
        PY
'on':
  push:
    branches:
    - master
    tags:
    - v*
  pull_request:
    branches:
    - master
  workflow_dispatch: null
